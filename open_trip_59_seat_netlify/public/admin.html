<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Open Trip</title><style>
body{margin:0;background:#f3f5f8;font-family:Arial;color:#172033}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;border-radius:15px;padding:15px;margin-bottom:14px;box-shadow:0 4px 18px #0001}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{padding:13px;border-radius:11px;background:#f1f3f6}.num{font-size:23px;font-weight:bold}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}button{border:0;border-radius:8px;padding:8px 10px;font-weight:bold;cursor:pointer}.pay{background:#22c55e;color:#fff}.cancel{background:#ef4444;color:#fff}.tag{padding:4px 7px;border-radius:7px;font-size:11px}.pending{background:#facc15}.paid{background:#dcfce7}.cancelled,.expired{background:#fee2e2}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.table{overflow:auto}table{min-width:760px}}
</style></head><body><div class="wrap">
<div class="card"><h2 style="margin:0 0 5px">🔐 Admin Open Trip</h2><div style="font-size:12px;color:#697386">Prototype online — halaman ini belum memakai login.</div></div>
<div class="card"><div class="stats"><div class="stat">Total<br><span class="num">59</span></div><div class="stat">Kosong<br><span class="num" id="avail">-</span></div><div class="stat">Pending<br><span class="num" id="pend">-</span></div><div class="stat">Terisi<br><span class="num" id="paid">-</span></div></div></div>
<div class="card"><div class="table"><table><thead><tr><th>ID</th><th>Pemesan</th><th>HP</th><th>Alamat</th><th>Kursi</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="tb"></tbody></table></div></div>
<script>
async function load(){try{let [br,sr]=await Promise.all([fetch("/api/bookings"),fetch("/api/seats")]);let b=await br.json(),s=await sr.json();let p=b.filter(x=>x.status==="pending").length,paid=b.filter(x=>x.status==="paid").length;let blocked=Object.keys(s.seats).length;document.getElementById("avail").textContent=59-blocked;document.getElementById("pend").textContent=p;document.getElementById("paid").textContent=paid;tb.innerHTML=b.map(x=>`<tr><td>#${x.id}</td><td><b>${esc(x.nama)}</b></td><td>${esc(x.nohp)}</td><td>${esc(x.alamat)}</td><td>${x.seats.join(", ")}</td><td><span class="tag ${x.status}">${x.status}</span></td><td>${x.status==="pending"?`<button class="pay" onclick="act(${x.id},'pay')">Konfirmasi Bayar</button> <button class="cancel" onclick="act(${x.id},'cancel')">Batalkan</button>`:"-"}</td></tr>`).join("")}catch(e){tb.innerHTML="<tr><td colspan=7>Gagal mengambil data.</td></tr>"}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function act(id,a){if(!confirm(a==="pay"?"Konfirmasi pembayaran booking #"+id+"?":"Batalkan booking #"+id+"?"))return;await fetch("/api/bookings/"+id+"/"+a,{method:"POST"});load()}
load();setInterval(load,5000);
</script></body></html>
